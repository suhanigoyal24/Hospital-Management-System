<!DOCTYPE html>
<html>
<head>
    <title>Login - CityCare</title>
</head>
<body>
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <label>Role:</label>
        <select name="role" required>
            <option value="">--Select--</option>
            <option value="doctor">Doctor</option>
            <option value="patient">Patient</option>
        </select>
        <button type="submit">Login</button>
    </form>
</body>
</html>
